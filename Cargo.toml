[package]
name = "pdt"
version = "0.1.0"
description = "CLI tools for resource pack management and development."
repository = "https://github.com/Love-and-Tolerance/pack-dev-tools"
authors = ["Silk Rose", "Meadowsys"]
edition = "2024"
license = "MIT"
resolver = "2"
publish = false

[dependencies]
camino = { version = "1.1.11" }
clap = { version = "4.5.45", features = ["derive"] }
colors-transform = { version = "0.2.11" }
deltae = { version = "0.3.2" }
fs_extra = { version = "1.3.0" }
image = { version = "0.25.6" }
indoc = { version = "2.0.6" }
itertools = { version = "0.14.0" }
lab = { version = "0.11.0" }
oxipng = { version = "9.1.5", default-features = false }
pdt-macros = { path = "./macros" }
pony = { git = "https://github.com/SilkRose/Pony" }
regex = { version = "1.11.1" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order"] }

[workspace]
members = ["macros"]


[profile.dev]
opt-level = 0
debug-assertions = true
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
debug-assertions = false
lto = true
codegen-units = 1
