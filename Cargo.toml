[package]
name = "pdt"
version = "0.1.0"
description = "CLI tools for resource pack management and development."
repository = "https://github.com/Love-and-Tolerance/pack-dev-tools"
authors = ["Silk Rose", "Meadowsys"]
edition = "2024"
license = "MIT"
resolver = "2"
publish = false

[dependencies]
atty = "0.2.14"
camino = "1.1.11"
clap = { version = "4.5.43", features = ["derive"] }
colors-transform = "0.2.11"
deltae = "0.3.2"
fs_extra = "1.3.0"
image = "0.25.6"
itertools = "0.14.0"
lab = "0.11.0"
num_cpus = "1.17.0"
# todo this is a major update to 9.1.5
oxipng = "9.1.5"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
serde_json = { version = "1.0.142", features = ["preserve_order"] }
tokio = { version = "1.47.1", features = ["full"] }
pdt-macros = { path = "./macros" }

[workspace]
members = ["macros"]

[features]
default = ["cmd", "color", "fs", "hash", "stdin", "struct", "thread", "trait"]
cmd = []
color = []
fs = []
hash = []
stdin = []
struct = []
thread = []
trait = []

[profile.dev]
opt-level = 0
debug-assertions = true
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
debug-assertions = false
lto = true
codegen-units = 1
